<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    El icono de la pestaña: el badge de la marca con el glifo del Grid
    dentro —el núcleo con su satélite en órbita—, el mismo de
    `src/components/brand/GridGlyph.tsx`.

    Va sin animación: en 16 píxeles la órbita no se distingue y un favicon
    que se mueve distrae en la barra de pestañas.
  -->
  <rect width="100" height="100" rx="26" fill="#0A1526"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="25.4" fill="none"
        stroke="#37D35B" stroke-opacity="0.85" stroke-width="1.5"/>

  <g transform="translate(23 23) scale(0.54)">
    <circle cx="50" cy="50" r="32" fill="none" stroke="#37D35B"
            stroke-width="4.5" opacity="0.45"/>
    <circle cx="50" cy="50" r="9.5" fill="#37D35B"/>
    <circle cx="50" cy="18" r="7" fill="#37D35B"/>
  </g>
</svg>
