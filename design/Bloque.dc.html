<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: #37D35B; text-decoration: none; }
    a:hover { color: #1F9B45; }
  </style>
</helmet>

<div style="width: 1600px;">

  <!-- ══ Bloque oscuro: el uso principal ══ -->
  <div style="width: 1600px; aspect-ratio: 16/9; background: radial-gradient(circle at 50% 40%, #12233E, #0B1729); border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 64px;">
    <div style="width: 280px; height: 280px; border-radius: 70px; background: #0A1526; border: 2px solid rgba(55,211,91,.85); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 70px rgba(0,0,0,.4);">
      <svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="{{ acento }}" stroke-width="7" stroke-linecap="round">
        <g stroke-width="4.5" opacity=".55">
          <path d="M26 26 L74 26 M26 50 L74 50 M26 74 L74 74" />
          <path d="M26 26 L26 74 M50 26 L50 74 M74 26 L74 74" />
        </g>
        <circle cx="26" cy="26" r="6.5" fill="{{ acento }}" stroke="none" />
        <circle cx="74" cy="26" r="6.5" fill="{{ acento }}" stroke="none" />
        <circle cx="26" cy="74" r="6.5" fill="{{ acento }}" stroke="none" />
        <circle cx="74" cy="74" r="6.5" fill="{{ acento }}" stroke="none" />
        <circle cx="50" cy="50" r="11" fill="{{ acento }}" stroke="none" />
      </svg>
    </div>
    <div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: .28em; color: {{ acento }};">SOHERSA</div>
      <div style="font-weight: 700; font-size: 96px; line-height: 1; letter-spacing: -.02em; color: #fff;">Knowledge<br>Grid</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: #9FB0C4; margin-top: 16px; letter-spacing: .02em;">{{ descriptor }}</div>
    </div>
  </div>

  <!-- ══ Bloque claro: papelería y documentos ══ -->
  <div style="width: 1600px; aspect-ratio: 16/9; background: #F3F6FA; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 64px; margin-top: 40px;">
    <div style="width: 280px; height: 280px; border-radius: 70px; background: #fff; border: 2px solid rgba(31,155,69,.5); display: flex; align-items: center; justify-content: center; box-shadow: 0 24px 56px rgba(14,28,51,.1);">
      <svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="#1F9B45" stroke-width="7" stroke-linecap="round">
        <g stroke-width="4.5" opacity=".55">
          <path d="M26 26 L74 26 M26 50 L74 50 M26 74 L74 74" />
          <path d="M26 26 L26 74 M50 26 L50 74 M74 26 L74 74" />
        </g>
        <circle cx="26" cy="26" r="6.5" fill="#1F9B45" stroke="none" />
        <circle cx="74" cy="26" r="6.5" fill="#1F9B45" stroke="none" />
        <circle cx="26" cy="74" r="6.5" fill="#1F9B45" stroke="none" />
        <circle cx="74" cy="74" r="6.5" fill="#1F9B45" stroke="none" />
        <circle cx="50" cy="50" r="11" fill="#1F9B45" stroke="none" />
      </svg>
    </div>
    <div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: .28em; color: #1F9B45;">SOHERSA</div>
      <div style="font-weight: 700; font-size: 96px; line-height: 1; letter-spacing: -.02em; color: #0E1C33;">Knowledge<br>Grid</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: #5B6B7D; margin-top: 16px; letter-spacing: .02em;">{{ descriptor }}</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"acento":{"editor":"color","default":"#37D35B","options":["#37D35B","#39B8B4","#1F9B45"]},"descriptor":{"editor":"text","default":"Centro de conocimiento"},"$preview":{"width":1600,"height":1840}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      acento: this.props.acento ?? '#37D35B',
      descriptor: this.props.descriptor ?? 'Centro de conocimiento',
    };
  }
}
</script>
</body>
</html>
